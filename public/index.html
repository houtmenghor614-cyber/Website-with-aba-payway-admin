<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="T-Shirt Cambodia - Admin dashboard for orders, payments, products and Telegram alerts."
    />
    <title>T-Shirt Cambodia Admin</title>
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/assets/logo/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#eef2ff",
                100: "#e0e7ff",
                200: "#c7d2fe",
                300: "#a5b4fc",
                400: "#818cf8",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",
                800: "#3730a3",
                900: "#312e81"
              },
              ink: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a"
              },
              accent: "#f59e0b"
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui"],
              display: ["Sora", "Inter", "ui-sans-serif"]
            },
            boxShadow: {
              card: "0 1px 2px rgba(15,23,42,.05), 0 6px 20px -10px rgba(15,23,42,.12)",
              pop: "0 8px 30px -8px rgba(79,70,229,.4)"
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-ink-100 text-ink-800 antialiased">
    <noscript>You need to enable JavaScript to run the admin panel.</noscript>
    <div id="root"></div>
  </body>
</html>
